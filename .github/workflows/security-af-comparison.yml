name: Compare AF integration
on:
  push:
    branches: ['codex/security-zap-web-e2e']
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/security-af-trial.mjs
