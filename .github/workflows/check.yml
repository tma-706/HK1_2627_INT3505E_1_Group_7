name: Verify Core and Mobile
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run test:ai-mock
      - run: bash tests/integration/core-ready.sh
      - run: node --test tests/unit/google-token.test.mjs
      - run: bash tests/integration/core-identity.sh
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix apps/mobile
      - run: npm run check --prefix apps/mobile
      - run: npm test --prefix apps/mobile
