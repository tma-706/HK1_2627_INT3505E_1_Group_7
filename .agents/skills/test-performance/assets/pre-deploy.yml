name: API quality and performance gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CANDIDATE_IMAGE: api-candidate:${{ github.sha }}
  RELEASE_ARTIFACT: tested-api-${{ github.sha }}

jobs:
  fast-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash ci/fast-verification.sh

  ephemeral-gate:
    needs: fast-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: http://127.0.0.1:18080
      COMPOSE_PROJECT_NAME: api-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_DIR: tests/performance/results/${{ github.run_id }}-${{ github.run_attempt }}/pre-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start candidate
        run: |
          mkdir -p "$REPORT_DIR"
          docker build --tag "$CANDIDATE_IMAGE" .
          candidate_id=$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")
          docker compose -f ci/compose.ephemeral.yml up --no-build --wait --wait-timeout 120 api
          container_id=$(docker compose -f ci/compose.ephemeral.yml ps -q api)
          test "$(docker inspect --format '{{.Image}}' "$container_id")" = "$candidate_id"
          printf '%s\n' "$candidate_id" > "$REPORT_DIR/image-id"
      - name: Smoke test
        run: bash ci/smoke.sh "$API_URL" "$REPORT_DIR"
      - name: Run project regression profiles
        run: bash ci/performance-gate.sh pre-deploy "$API_URL" "$REPORT_DIR"
      - name: Save CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-reports-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
      - name: Remove temporary services
        if: always()
        run: docker compose -f ci/compose.ephemeral.yml down --volumes
      - name: Package tested candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          candidate_id=$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")
          test "$candidate_id" = "$(cat "$REPORT_DIR/image-id")"
          mkdir -p "$RUNNER_TEMP/tested-api"
          cp "$REPORT_DIR/image-id" "$RUNNER_TEMP/tested-api/image-id"
          docker image save --output "$RUNNER_TEMP/tested-api/image.tar" "$CANDIDATE_IMAGE"
      - name: Pass candidate to staging job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/tested-api/
          overwrite: true
          if-no-files-found: error

  staging-load-gate:
    needs: ephemeral-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: shared-api-staging
      cancel-in-progress: false
    outputs:
      release_id: ${{ steps.approved-release.outputs.release_id }}
      release_artifact_name: ${{ steps.approved-release.outputs.artifact_name }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      REPORT_DIR: tests/performance/results/${{ github.run_id }}-${{ github.run_attempt }}/staging
      RELEASE_FILE: ${{ runner.temp }}/staging-release.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/tested-api/
      - name: Deploy tested candidate
        env:
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          test -n "$STAGING_URL"
          mkdir -p "$REPORT_DIR"
          docker image load --input "$RUNNER_TEMP/tested-api/image.tar"
          candidate_id=$(docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE")
          test "$candidate_id" = "$(cat "$RUNNER_TEMP/tested-api/image-id")"
          bash ci/deploy-staging.sh "$CANDIDATE_IMAGE" "$GITHUB_SHA" "$RELEASE_FILE"
          jq -e '.release_id | strings | select(length > 0)' "$RELEASE_FILE" >/dev/null
          cp "$RELEASE_FILE" "$REPORT_DIR/release.json"
      - name: Confirm staging release and smoke test
        env:
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
        run: |
          bash ci/verify-staging.sh "$STAGING_URL" "$RELEASE_FILE"
          bash ci/smoke.sh "$STAGING_URL" "$REPORT_DIR"
      - name: Run project staging profiles
        id: staging_gate
        env:
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
        run: bash ci/performance-gate.sh staging "$STAGING_URL" "$REPORT_DIR"
      - name: Recheck staging release
        if: ${{ !cancelled() && (steps.staging_gate.outcome == 'success' || steps.staging_gate.outcome == 'failure') }}
        env:
          STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
        run: bash ci/verify-staging.sh "$STAGING_URL" "$RELEASE_FILE"
      - name: Save staging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-load-reports-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
      - name: Prepare approved release metadata
        id: approved-release
        run: |
          release_id=$(jq -er '.release_id | strings | select(length > 0)' "$RELEASE_FILE")
          [[ "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:@/-]*$ ]]
          mkdir -p "$RUNNER_TEMP/approved-release"
          cp "$RELEASE_FILE" "$RUNNER_TEMP/approved-release/release.json"
          printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/approved-release/workflow.txt"
          printf 'release_id=%s\nartifact_name=perf-approved-%s-%s\n' "$release_id" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save approved release metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.approved-release.outputs.artifact_name }}
          path: ${{ runner.temp }}/approved-release/
          if-no-files-found: error
