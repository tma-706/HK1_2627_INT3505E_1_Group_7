/conversations:
  get:
    tags:
      - Chat và thông báo
    summary: Liệt kê hội thoại của tôi
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ hội thoại có một trong hai bên của tương tác đã chấp nhận. Sắp xếp theo cập nhật và ID giảm dần.
    operationId: listConversations
    x-use-cases:
      - UC19
    x-access: member
    security:
      - CoreSession: []
    parameters:
      - $ref: ../components/parameters/Cursor.yaml
      - $ref: ../components/parameters/Limit.yaml
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ConversationPage.yaml
            example:
              items:
                - conversationId: item-123
                  postId: item-123
                  interactionId: item-123
                  interactionType: claim
                  mode: readWrite
                  updatedAt: '2026-11-24T05:00:00Z'
              nextCursor: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '503':
        $ref: ../components/responses.yaml#/unavailable
/conversations/{conversationId}:
  parameters:
    - name: conversationId
      in: path
      required: true
      description: ID tài nguyên conversationId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  get:
    tags:
      - Chat và thông báo
    summary: Xem thông tin hội thoại
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ hai bên của tương tác được chấp nhận. Chat chuyển sang chỉ đọc khi bài Closed hoặc Returned.
    operationId: getConversation
    x-use-cases:
      - UC19
    x-access: member
    security:
      - CoreSession: []
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Conversation.yaml
            example:
              conversationId: item-123
              postId: item-123
              interactionId: item-123
              interactionType: claim
              mode: readWrite
              updatedAt: '2026-11-24T05:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '503':
        $ref: ../components/responses.yaml#/unavailable
/conversations/{conversationId}/messages:
  parameters:
    - name: conversationId
      in: path
      required: true
      description: ID tài nguyên conversationId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  get:
    tags:
      - Chat và thông báo
    summary: Xem tin nhắn hội thoại
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ hai bên. Lấy trang mới nhất trước, theo thời điểm gửi và ID giảm dần. Lịch sử được lưu tối đa 12 tháng
      sau khi bài đóng.
    operationId: listMessages
    x-use-cases:
      - UC19
    x-access: member
    security:
      - CoreSession: []
    parameters:
      - $ref: ../components/parameters/Cursor.yaml
      - $ref: ../components/parameters/Limit.yaml
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/MessagePage.yaml
            example:
              items:
                - messageId: item-123
                  conversationId: item-123
                  senderId: item-123
                  text: Chào bạn, mình có thể hẹn tại thư viện.
                  sentAt: '2026-11-24T05:00:00Z'
              nextCursor: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '503':
        $ref: ../components/responses.yaml#/unavailable
  post:
    tags:
      - Chat và thông báo
    summary: Gửi tin nhắn văn bản
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ hai bên của tương tác đã chấp nhận khi chat còn cho ghi. Tài khoản bị khóa không gửi được. MVP chỉ có
      văn bản, tin đã gửi giữ nguyên và có thể báo cáo.
    operationId: sendMessage
    x-use-cases:
      - UC19
      - UC20
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/MessageWrite.yaml
          example:
            text: Chào bạn, mình có thể hẹn tại thư viện.
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/conversations/{conversationId}/messages/{messageId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Message.yaml
            example:
              messageId: item-123
              conversationId: item-123
              senderId: item-123
              text: Chào bạn, mình có thể hẹn tại thư viện.
              sentAt: '2026-11-24T05:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '503':
        $ref: ../components/responses.yaml#/unavailable
