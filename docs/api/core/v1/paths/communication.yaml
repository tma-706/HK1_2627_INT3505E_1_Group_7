/me/notification-preferences:
  get:
    tags:
      - Chat và thông báo
    summary: Xem tùy chọn thông báo
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Email hoạt động có thể cấu hình. Email xác thực và bảo mật luôn bật.
    operationId: getNotificationPreferences
    x-use-cases:
      - UC20
    x-access: member
    security:
      - CoreSession: []
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/NotificationPreferences.yaml
            example:
              activityEmailEnabled: true
              verificationEmailEnabled: true
              securityEmailEnabled: true
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '503':
        $ref: ../components/responses.yaml#/unavailable
  patch:
    tags:
      - Chat và thông báo
    summary: Đổi tùy chọn email hoạt động
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ ghi activityEmailEnabled. Claim/phản hồi, kết quả kiểm duyệt và sự kiện bảo mật dùng email theo chính
      sách. Tin nhắn có thể vào bản tổng hợp, gợi ý AI chỉ trong ứng dụng. Email loại số điện thoại, địa chỉ cụ
      thể, dữ liệu xác minh và ghi chú riêng. Worker thử lại tối đa 3 lần sau lỗi gửi.
    operationId: updateNotificationPreferences
    x-use-cases:
      - UC20
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotificationPreferencesUpdate.yaml
          example:
            activityEmailEnabled: true
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/NotificationPreferences.yaml
            example:
              activityEmailEnabled: true
              verificationEmailEnabled: true
              securityEmailEnabled: true
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '503':
        $ref: ../components/responses.yaml#/unavailable
