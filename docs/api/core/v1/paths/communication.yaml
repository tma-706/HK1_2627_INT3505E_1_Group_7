      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ bên tham gia hội thoại có quyền đọc tin. Hệ thống ghi nhận báo cáo. Hàng đợi và quy trình giải quyết
