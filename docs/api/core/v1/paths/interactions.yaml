/posts/{postId}/claim-questions:
  parameters:
    - name: postId
      in: path
      required: true
      description: ID tài nguyên postId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  get:
    tags:
      - Yêu cầu và phản hồi
    summary: Xem câu hỏi để gửi claim
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ người đủ điều kiện gửi claim cho bài Found Open và Visible. Finder quản lý bộ câu hỏi qua nghiệp vụ
      bài của mình. Câu hỏi bị giữ riêng khỏi API công khai.
    operationId: getClaimQuestions
    x-use-cases:
      - UC07
      - UC15
    x-access: member
    security:
      - CoreSession: []
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/VerificationQuestions.yaml
            example:
              questions:
                - questionId: item-123
                  text: Khóa kéo của chiếc ví có đặc điểm gì?
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '503':
        $ref: ../components/responses.yaml#/unavailable
/posts/{postId}/claims:
  parameters:
    - name: postId
      in: path
      required: true
      description: ID tài nguyên postId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Yêu cầu và phản hồi
    summary: Gửi claim nhận đồ
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ Found Open và Visible còn nhận claim. Mỗi tài khoản chỉ có một claim hoạt động trên bài. Trả lời mỗi
      câu hiện hành đúng một lần. Tối đa 3 lượt gửi hoặc gửi lại trong 30 ngày trượt, kể cả khi claim đã rút,
      hết hạn hoặc bị bác. Core kiểm điều kiện và tính lượt trong cùng giao dịch.
    operationId: submitClaim
    x-use-cases:
      - UC15
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ClaimAnswerSubmission.yaml
          example:
            answers:
              - questionId: item-123
                answer: Khóa kéo có móc bằng vải tối màu.
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/posts/{postId}/claims/{claimId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/Claim.yaml
            example:
              claimId: item-123
              postId: item-123
              status: pending
              updatedAt: '2026-11-24T05:00:00Z'
              createdAt: '2026-11-24T05:00:00Z'
              answers:
                - questionId: item-123
                  answer: Khóa kéo có móc bằng vải tối màu.
              conversationId: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        description: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/Problem.yaml
            example:
              type: urn:campus-lost-found:problem:active-claim-or-post-unavailable
              title: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
              status: 409
              code: ACTIVE_CLAIM_OR_POST_UNAVAILABLE
        headers:
          Cache-Control:
            description: Phản hồi có thể thay đổi theo phiên, quyền hoặc trạng thái tài nguyên.
            schema:
              type: string
              const: no-store
            required: true
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '429':
        description: Đã đạt hạn mức. Retry-After cho biết số giây trước thời điểm có thể thử lại.
        headers:
          Retry-After:
            description: Số giây đến mốc thử lại.
            schema:
              type: integer
              minimum: 1
              example: 900
            required: true
          Cache-Control:
            description: Phản hồi có thể thay đổi theo phiên, quyền hoặc trạng thái tài nguyên.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/Problem.yaml
            example:
              type: urn:campus-lost-found:problem:claim-attempt-limit
              title: Đã đạt hạn mức. Retry-After cho biết số giây trước thời điểm có thể thử lại.
              status: 429
              code: CLAIM_ATTEMPT_LIMIT
      '503':
        $ref: ../components/responses.yaml#/unavailable
  get:
    tags:
      - Yêu cầu và phản hồi
    summary: Liệt kê claim trên bài Found
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ Finder tạo bài. Sắp xếp thời điểm tạo và ID giảm dần. Đọc câu trả lời qua chi tiết claim.
    operationId: listPostClaims
    x-use-cases:
      - UC16
    x-access: member
    security:
      - CoreSession: []
    parameters:
      - $ref: ../components/parameters/Cursor.yaml
      - $ref: ../components/parameters/Limit.yaml
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ClaimPage.yaml
            example:
              items:
                - claimId: item-123
                  postId: item-123
                  status: pending
                  updatedAt: '2026-11-24T05:00:00Z'
                  createdAt: '2026-11-24T05:00:00Z'
              nextCursor: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '503':
        $ref: ../components/responses.yaml#/unavailable
