/post-drafts/{draftId}/publications:
  parameters:
    - name: draftId
      in: path
      required: true
      description: ID tài nguyên draftId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Bài đăng
    summary: Xuất bản bản nháp
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Kiểm textReviewId gắn đúng nội dung. Chỉ công khai dữ liệu đã che đạt yêu cầu và ảnh đã xử lý đúng bản
      nháp. Found phải có 1–3 câu hỏi, Lost không có câu hỏi. Một bản nháp chỉ xuất bản một lần. Sau khi công
      khai, đưa bài vào matching.
    operationId: publishPostDraft
    x-use-cases:
      - UC05
      - UC06
      - UC07
      - UC23
      - UC24
      - UC21
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PublishPost.yaml
          example:
            textReviewId: item-123
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/me/posts/{postId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/MyPost.yaml
            example:
              postId: item-123
              type: lost
              title: Ví vải màu xanh
              description: Ví vải màu xanh được tìm thấy gần thư viện.
              categoryId: item-123
              occurredAt: '2026-11-24T05:00:00Z'
              areaId: item-123
              status: open
              visibility: visible
              publishedAt: '2026-11-24T05:00:00Z'
              photos:
                - imageId: item-123
                  url: https://example.test/resource
              newClaimCount: 0
              newResponseCount: 0
              acceptedInteractionId: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
/post-drafts/{draftId}/verification-questions:
  parameters:
    - name: draftId
      in: path
      required: true
      description: ID tài nguyên draftId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  put:
    tags:
      - Bài đăng
    summary: Đặt câu hỏi cho bản nháp Found
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Tác giả Found thay toàn bộ 1–3 câu hỏi. Hệ thống lưu câu hỏi, không có trường đáp án đúng và Finder tự
      đánh giá câu trả lời khi duyệt.
    operationId: setDraftVerificationQuestions
    x-use-cases:
      - UC06
      - UC07
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VerificationQuestionWrite.yaml
          example:
            questions:
              - Khóa kéo của chiếc ví có đặc điểm gì?
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/VerificationQuestions.yaml
            example:
              questions:
                - questionId: item-123
                  text: Khóa kéo của chiếc ví có đặc điểm gì?
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
/posts/{postId}/verification-questions:
  parameters:
    - name: postId
      in: path
