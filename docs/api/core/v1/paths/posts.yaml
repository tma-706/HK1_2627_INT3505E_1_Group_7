    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ Finder tạo bài Found. Sau khi claim đầu tiên được tạo, cả chỉnh câu hỏi và thêm hoặc xóa câu đều bị
      khóa. Kiểm điều kiện và ghi thay đổi trong cùng giao dịch.
    operationId: replacePostVerificationQuestions
    x-use-cases:
      - UC07
      - UC09
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VerificationQuestionWrite.yaml
          example:
            questions:
              - Khóa kéo của chiếc ví có đặc điểm gì?
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/VerificationQuestions.yaml
            example:
              questions:
                - questionId: item-123
                  text: Khóa kéo của chiếc ví có đặc điểm gì?
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        description: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/Problem.yaml
            example:
              type: urn:campus-lost-found:problem:verification-questions-locked
              title: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
              status: 409
              code: VERIFICATION_QUESTIONS_LOCKED
        headers:
          Cache-Control:
            description: Phản hồi có thể thay đổi theo phiên, quyền hoặc trạng thái tài nguyên.
            schema:
              type: string
              const: no-store
            required: true
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
  get:
    tags:
      - Bài đăng
    summary: Xem câu hỏi xác minh của bài Found
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ Finder tạo bài. Trả câu hỏi đang dùng để đối chiếu claim hoặc chỉnh trước claim đầu tiên.
    operationId: getPostVerificationQuestions
    x-use-cases:
      - UC07
      - UC09
    x-access: member
    security:
      - CoreSession: []
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/VerificationQuestions.yaml
            example:
              questions:
                - questionId: item-123
                  text: Khóa kéo của chiếc ví có đặc điểm gì?
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '503':
        $ref: ../components/responses.yaml#/unavailable
