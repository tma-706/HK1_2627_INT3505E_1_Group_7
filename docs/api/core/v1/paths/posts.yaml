      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ trả bài do chủ thể tạo. Sắp xếp theo thời điểm công khai và ID giảm dần. Bộ đếm tương tác mới theo
      loại bài, quy tắc đặt lại bộ đếm còn mở.
