/post-drafts:
  post:
    tags:
      - Bài đăng
    summary: Tạo bản nháp Lost hoặc Found
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chủ thể của phiên sở hữu bản nháp. Bản nháp Found có cách bảo quản và ghi chú tùy chọn chỉ Finder tạo bài
      được đọc. Giữ cùng một loại bài trong suốt vòng đời.
    operationId: createPostDraft
    x-use-cases:
      - UC05
      - UC06
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostDraftCreate.yaml
          example:
            type: lost
            title: Ví vải màu xanh
            description: Ví vải màu xanh được tìm thấy gần thư viện.
            categoryId: item-123
            occurredAt: '2026-11-24T05:00:00Z'
            areaId: item-123
            photoUploadIds: []
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/post-drafts/{draftId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/PostDraft.yaml
            example:
              draftId: item-123
              type: lost
              title: Ví vải màu xanh
              description: Ví vải màu xanh được tìm thấy gần thư viện.
              categoryId: item-123
              occurredAt: '2026-11-24T05:00:00Z'
              areaId: item-123
              photoUploadIds: []
              verificationQuestions: []
              updatedAt: '2026-11-24T05:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '503':
        $ref: ../components/responses.yaml#/unavailable
