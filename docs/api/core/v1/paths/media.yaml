/uploads/{uploadId}/confirmations:
  parameters:
    - name: uploadId
      in: path
      required: true
      description: ID tài nguyên uploadId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Ảnh và upload
    summary: Xác nhận upload
    description: >-
      Phiên Bearer của người bị ảnh hưởng hoặc Bearer giới hạn cho khiếu nại do Core cấp sau xác minh. Quyền chỉ
      áp dụng cho quyết định của chính chủ thể. Chỉ chủ thể sở hữu lượt upload. Với Bearer giới hạn khiếu nại,
      chỉ xử lý lượt đúng quyết định khiếu nại của chủ thể. Core chốt đúng phiên bản object, kiểm metadata và
      tạo một job trong cùng giao dịch. Gửi lại xác nhận trả trạng thái hiện hành. Worker xác minh kích thước,
      định dạng, checksum và xử lý ảnh, chỉ đưa bản đã che hợp lệ vào tài nguyên công khai.
    operationId: confirmUpload
    x-use-cases:
      - UC04
      - UC05
      - UC06
      - UC09
      - UC17
      - UC24
      - UC29
    x-access: appeal
    security:
      - CoreSession: []
      - AppealSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UploadConfirmation.yaml
          example: {}
    responses:
      '200':
        description: Đã xác nhận ở lượt trước. Trả trạng thái hiện hành.
        headers:
          Cache-Control:
            description: Trạng thái upload riêng tư.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/UploadStatus.yaml
            example:
              uploadId: item-123
              status: processing
              updatedAt: '2026-11-24T05:00:00Z'
              redactionMode: null
              failureCode: null
              previewUrl: null
      '202':
        description: Yêu cầu đã được tiếp nhận. Theo dõi tài nguyên được nêu trong Location.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/uploads/{uploadId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/UploadStatus.yaml
            example:
              uploadId: item-123
              status: processing
              updatedAt: '2026-11-24T05:00:00Z'
              redactionMode: null
              failureCode: null
              previewUrl: null
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
    x-operation-notes: Sau khi đã tiếp nhận, gửi lại có thể trả 200 với trạng thái hiện hành, và không thêm job.
