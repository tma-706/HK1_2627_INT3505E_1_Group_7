/post-drafts/{draftId}/uploads:
  parameters:
    - name: draftId
      in: path
      required: true
      description: ID tài nguyên draftId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Ảnh và upload
    summary: Cấp quyền upload trực tiếp
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Chỉ tác giả. Một quyền POST ghi ngắn hạn cho đúng một object tạm. Tối đa 5 ảnh bài đăng, JPG/PNG/WEBP và
      10 MB mỗi ảnh. Bản sửa phải còn quyền thay ảnh. Client gửi toàn bộ formFields qua HTTPS đến uploadUrl,
      thêm tệp và giữ version nhận được. Khóa idempotency được ràng buộc với chủ thể, đích, mục đích và nội
      dung.
    operationId: createDraftPhotoUpload
    x-use-cases:
      - UC05
      - UC06
      - UC24
    x-access: member
    security:
      - CoreSession: []
    parameters:
      - $ref: ../components/parameters/IdempotencyKey.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostPhotoUploadRequest.yaml
          example:
            contentType: image/jpeg
            sizeBytes: 321900
            sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/uploads/{uploadId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/UploadGrant.yaml
            example:
              uploadId: item-123
              method: POST
              uploadUrl: https://example.test/resource
              formFields:
                key: demo-object
                policy: demo-policy
              uploadExpiresAt: '2026-11-24T05:00:00Z'
              confirmationExpiresAt: '2026-11-24T05:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        description: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/Problem.yaml
            example:
              type: urn:campus-lost-found:problem:upload-grant-conflict
              title: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
              status: 409
              code: UPLOAD_GRANT_CONFLICT
        headers:
          Cache-Control:
            description: Phản hồi có thể thay đổi theo phiên, quyền hoặc trạng thái tài nguyên.
            schema:
              type: string
              const: no-store
            required: true
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
