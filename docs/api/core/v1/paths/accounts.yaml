/auth/appeal-sessions:
  post:
    tags:
      - Tài khoản và phiên
    summary: Xác minh quyền khiếu nại giới hạn
    description: >-
      Guest và người dùng đã đăng nhập. Thao tác này sử dụng dữ liệu công khai hoặc dữ liệu xác thực ở đầu vào.
      Phương án v1 cho chủ thể bị khóa không thể đăng nhập. Core xác minh thông tin xác thực dành riêng cho
      quyết định, cấp Bearer giới hạn cho quyết định của chủ thể. Luồng phát hành và TTL credential giới hạn
      được ghi ở v1-notes, không cấp quyền tạo tương tác khác.
    operationId: exchangeAppealCredential
    x-use-cases:
      - UC29
    x-access: guest
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/EmailToken.yaml
          example:
            token: fictional-secret-123
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/AppealSession.yaml
            example:
              accessToken: demo-appeal-session
              expiresAt: '2026-11-24T05:00:00Z'
              decisionId: decision-123
              tokenType: Bearer
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/invalidCredentials
      '410':
        $ref: ../components/responses.yaml#/gone
      '503':
        $ref: ../components/responses.yaml#/unavailable
