      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Xác minh mật khẩu hiện tại trước khi đổi. Chính sách mật khẩu và ảnh hưởng đến các phiên khác được theo
