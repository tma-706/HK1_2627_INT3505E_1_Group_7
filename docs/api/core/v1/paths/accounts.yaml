    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProfileUpdate.yaml
          example:
            displayName: Lan
    responses:
      '200':
        description: Thao tác hoàn tất.
        headers:
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
