/posts/{postId}/reports:
  parameters:
    - name: postId
      in: path
      required: true
      description: ID tài nguyên postId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Kiểm duyệt
    summary: Báo cáo bài đăng
    description: >-
      Tài khoản đã xác thực email, có phiên hiệu lực. Core kiểm lại chính sách khóa và quyền theo tài nguyên.
      Tài khoản đã xác thực email báo cáo một lần trên mỗi bài. Khi có 5 báo cáo hợp lệ từ 5 tài khoản khác nhau
      trong 24 giờ, Core ẩn bài và đưa vào hàng đợi kiểm duyệt. Rút/xử lý report không tự khôi phục bài.
    operationId: reportPost
    x-use-cases:
      - UC22
      - UC26
    x-access: member
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReportWrite.yaml
          example:
            reason: spam
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/me/reports/{reportId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ReportReceipt.yaml
            example:
              reportId: item-123
              createdAt: '2026-11-24T05:00:00Z'
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        description: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/Problem.yaml
            example:
              type: urn:campus-lost-found:problem:post-already-reported
              title: Trạng thái hoặc dữ liệu hiện hành xung đột với thao tác.
              status: 409
              code: POST_ALREADY_REPORTED
        headers:
          Cache-Control:
            description: Phản hồi có thể thay đổi theo phiên, quyền hoặc trạng thái tài nguyên.
            schema:
              type: string
              const: no-store
            required: true
      '503':
        $ref: ../components/responses.yaml#/unavailable
