/admin/return-reviews:
  get:
    tags:
      - Kiểm duyệt
    summary: Xem trao trả cần xử lý
    description: >-
      Phiên hiệu lực và quyền quản trị tương ứng với thao tác. Core kiểm lại quyền mỗi lần gọi. Yêu cầu quyền
