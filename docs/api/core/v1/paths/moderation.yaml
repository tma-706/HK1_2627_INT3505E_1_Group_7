        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '503':
        $ref: ../components/responses.yaml#/unavailable
/admin/reported-posts/{caseId}/decisions:
  parameters:
    - name: caseId
      in: path
      required: true
      description: ID tài nguyên caseId.
      schema:
        type: string
        minLength: 1
        examples:
          - item-123
  post:
    tags:
      - Kiểm duyệt
    summary: Ra quyết định kiểm duyệt bài
    description: >-
      Phiên hiệu lực và quyền quản trị tương ứng với thao tác. Core kiểm lại quyền mỗi lần gọi. Yêu cầu quyền
      quyết định bài. Hide là ẩn tạm thời, Remove gỡ công khai, Restore dành cho Hidden/Removed có lý do.
      Dismiss kết thúc xử lý báo cáo, không tự đưa bài đã ẩn trở lại công khai. Ghi người xử lý, thời gian, bằng
      chứng và quyết định. Báo kết quả cho tác giả và người báo cáo. Warn/Lock tài khoản đi qua UC27.
    operationId: decideReportedPost
    x-use-cases:
      - UC22
      - UC26
    x-access: admin
    security:
      - CoreSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostModerationWrite.yaml
          example:
            decision: dismiss
            reason: Lý do đã được kiểm tra.
    responses:
      '201':
        description: Tài nguyên đã được tạo.
        headers:
          Location:
            description: 'URI tham chiếu của tài nguyên. Mẫu: /api/v1/admin/reported-posts/{caseId}/decisions/{decisionId}'
            schema:
              type: string
              format: uri-reference
            required: true
          Cache-Control:
            description: Phản hồi riêng tư hoặc chứa dữ liệu xác thực.
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/PostModerationDecision.yaml
            example:
              decisionId: item-123
              reviewerId: item-123
              reason: Lý do đã được kiểm tra.
              decidedAt: '2026-11-24T05:00:00Z'
              decision: dismiss
              newVisibility: visible
      '400':
        $ref: ../components/responses.yaml#/invalidRequest
      '401':
        $ref: ../components/responses.yaml#/unauthorized
      '403':
        $ref: ../components/responses.yaml#/forbidden
      '404':
        $ref: ../components/responses.yaml#/concealed
      '409':
        $ref: ../components/responses.yaml#/conflict
      '422':
        $ref: ../components/responses.yaml#/unprocessable
      '503':
        $ref: ../components/responses.yaml#/unavailable
