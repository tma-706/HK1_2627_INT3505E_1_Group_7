openapi: 3.1.0
info:
  title: Campus Lost & Found Core API
  version: 1.0.0
  description: >-
    Hợp đồng REST thiết kế cho UC01–UC30 ngày 24/11/2026. URL nghiệp vụ qua gateway dùng /api/v1. Hợp đồng thực
    nghiệm 0.3.0 và readiness nằm trong openapi.json.
servers:
  - url: /api/v1
    description: Tiền tố API nghiệp vụ tại gateway HTTPS.
security:
  - CoreSession: []
tags:
  - name: Tài khoản và phiên
    description: Đăng ký, xác minh email, quản lý thông tin xác thực, phiên và hồ sơ cá nhân.
  - name: Bài đăng
    description: Xem và tìm bài công khai, quản lý bản nháp và bài của tôi, xác nhận trao trả.
  - name: Yêu cầu và phản hồi
    description: Gửi và xét duyệt yêu cầu nhận đồ, phản hồi bài báo mất và xem tương tác của tôi.
  - name: Chat và thông báo
    description: Hội thoại giữa hai bên, báo cáo tin nhắn và quản lý thông báo cá nhân.
  - name: AI và dữ liệu đã che
    description: Đối sánh bài đăng, xem trước và che văn bản, gợi ý câu hỏi xác minh.
  - name: Ảnh và upload
    description: Cấp quyền tải tệp trực tiếp, xác nhận upload, theo dõi xử lý và chỉnh vùng che ảnh.
  - name: Kiểm duyệt
    description: Xử lý báo cáo, tài khoản vi phạm, trao trả cần xem xét và khiếu nại.
  - name: Danh mục
    description: Tra cứu, quản lý và ánh xạ danh mục đồ vật.
