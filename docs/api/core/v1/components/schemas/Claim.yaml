type: object
additionalProperties: false
required:
  - claimId
  - postId
  - status
  - updatedAt
  - createdAt
  - answers
  - conversationId
properties:
  claimId:
    type: string
    minLength: 1
    examples:
      - item-123
  postId:
    type: string
    minLength: 1
    examples:
      - item-123
  status:
    type: string
    enum:
      - pending
      - approved
      - rejected
      - withdrawn
      - expired
      - superseded
  updatedAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  createdAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  answers:
    type: array
    items:
      $ref: ./ClaimAnswer.yaml
    maxItems: 3
    minItems: 1
  conversationId:
    anyOf:
      - type: string
        minLength: 1
        examples:
          - item-123
      - type: 'null'
