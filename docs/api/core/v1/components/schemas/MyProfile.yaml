type: object
additionalProperties: false
required:
  - accountId
  - email
  - displayName
  - avatarUrl
properties:
  accountId:
    type: string
    minLength: 1
    examples:
      - item-123
  email:
    type: string
    format: email
    examples:
      - lan@example.test
  displayName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Lan
  avatarUrl:
    anyOf:
      - type: string
        format: uri
        examples:
          - https://example.test/resource
      - type: 'null'
