type: object
description: Chỉ cập nhật các trường được gửi. Trường vắng mặt giữ nguyên giá trị hiện tại.
additionalProperties: false
properties:
  title:
    type: string
    minLength: 5
    maxLength: 100
    examples:
      - Ví vải màu xanh
  description:
    type: string
    minLength: 20
    maxLength: 2000
    examples:
      - Ví vải màu xanh được tìm thấy gần thư viện.
  categoryId:
    type: string
    minLength: 1
    examples:
      - item-123
  occurredAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  areaId:
    type: string
    minLength: 1
    examples:
      - item-123
  photoUploadIds:
    type: array
    description: >-
      Thay thế danh sách ảnh được gắn vào bản nháp. Mảng rỗng gỡ toàn bộ ảnh khỏi bản nháp khi trạng thái cho phép sửa.
    items:
      type: string
      minLength: 1
      examples:
        - item-123
    maxItems: 5
  custody:
    type: string
    enum:
      - heldByFinder
      - handedToAuthorities
  privateNote:
    description: Gửi null để xóa ghi chú riêng nếu người gọi được phép sửa ghi chú.
    anyOf:
      - type: string
        maxLength: 1000
        examples:
          - Ghi chú riêng
      - type: 'null'
minProperties: 1
