type: object
additionalProperties: false
properties:
  title:
    type: string
    minLength: 5
    maxLength: 100
    examples:
      - Ví vải màu xanh
  description:
    type: string
    minLength: 20
    maxLength: 2000
    examples:
      - Ví vải màu xanh được tìm thấy gần thư viện.
  categoryId:
    type: string
    minLength: 1
    examples:
      - item-123
  occurredAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  areaId:
    type: string
    minLength: 1
    examples:
      - item-123
  photoUploadIds:
    type: array
    items:
      type: string
      minLength: 1
      examples:
        - item-123
    maxItems: 5
  custody:
    type: string
    enum:
      - heldByFinder
      - handedToAuthorities
  privateNote:
    anyOf:
      - type: string
        maxLength: 1000
        examples:
          - Ghi chú riêng
      - type: 'null'
minProperties: 1
