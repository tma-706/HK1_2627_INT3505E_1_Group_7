type: object
additionalProperties: false
required:
  - accountId
  - role
  - accessToken
  - expiresAt
  - tokenType
properties:
  accountId:
    type: string
    minLength: 1
    examples:
      - item-123
  role:
    type: string
    enum:
      - member
      - admin
  accessToken:
    type: string
    minLength: 1
    examples:
      - demo-core-session
  expiresAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  tokenType:
    type: string
    const: Bearer
