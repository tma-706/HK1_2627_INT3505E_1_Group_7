type: object
additionalProperties: false
required:
  - accountId
  - email
  - role
  - displayName
  - status
properties:
  accountId:
    type: string
    minLength: 1
    examples:
      - item-123
  email:
    type: string
    format: email
    examples:
      - lan@example.test
  role:
    type: string
    enum:
      - member
      - admin
  displayName:
    type: string
    minLength: 1
    maxLength: 100
    examples:
      - Lan
  status:
    type: string
    enum:
      - active
      - unverified
      - temporarilyLoginLocked
      - moderationLocked
