type: object
additionalProperties: false
required:
  - email
  - password
properties:
  email:
    type: string
    format: email
    maxLength: 254
    examples:
      - lan@example.test
  password:
    type: string
    minLength: 15
    maxLength: 128
    description: 15–128 ký tự Unicode khi nhập. Core chuẩn hóa NFC trước khi băm.
    examples:
      - fictional-secret-123
    writeOnly: true
