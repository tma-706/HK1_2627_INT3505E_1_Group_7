type: object
additionalProperties: false
required:
  - appealId
  - decisionId
  - reason
  - status
  - submittedAt
  - outcome
  - resolvedAt
  - appellantId
properties:
  appealId:
    type: string
    minLength: 1
    examples:
      - item-123
  decisionId:
    type: string
    minLength: 1
    examples:
      - item-123
  reason:
    type: string
    minLength: 1
    examples:
      - Lý do đã được kiểm tra.
  status:
    type: string
    enum:
      - submitted
      - inReview
      - decided
  submittedAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  outcome:
    anyOf:
      - type: string
        enum:
          - uphold
          - overturn
          - adjust
      - type: 'null'
  resolvedAt:
    anyOf:
      - type: string
        format: date-time
        examples:
          - '2026-11-24T05:00:00Z'
      - type: 'null'
  appellantId:
    type: string
    minLength: 1
    examples:
      - item-123
