type: object
additionalProperties: false
required:
  - contentType
  - sizeBytes
  - sha256
properties:
  contentType:
    type: string
    enum:
      - image/jpeg
      - image/png
      - image/webp
  sizeBytes:
    type: integer
    minimum: 1
    maximum: 10000000
    examples:
      - 321900
  sha256:
    type: string
    pattern: ^[A-Fa-f0-9]{64}$
    examples:
      - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
