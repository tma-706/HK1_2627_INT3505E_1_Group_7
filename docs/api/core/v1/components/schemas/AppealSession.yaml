type: object
additionalProperties: false
required:
  - accessToken
  - expiresAt
  - decisionId
  - tokenType
properties:
  accessToken:
    type: string
    minLength: 1
    examples:
      - demo-appeal-session
  expiresAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  decisionId:
    type: string
    minLength: 1
    examples:
      - item-123
  tokenType:
    type: string
    const: Bearer
