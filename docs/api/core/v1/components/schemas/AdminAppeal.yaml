type: object
additionalProperties: false
required:
  - appealId
  - decisionId
  - reason
  - status
  - submittedAt
  - outcome
  - resolvedAt
  - appellantId
  - evidence
  - originalDecision
  - reviewHistory
properties:
  appealId:
    type: string
    minLength: 1
    examples:
      - item-123
  decisionId:
    type: string
    minLength: 1
    examples:
      - item-123
  reason:
    type: string
    minLength: 1
    examples:
      - Lý do đã được kiểm tra.
  status:
    type: string
    enum:
      - submitted
      - inReview
      - decided
  submittedAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  outcome:
    anyOf:
      - type: string
        enum:
          - uphold
          - overturn
          - adjust
      - type: 'null'
  resolvedAt:
    anyOf:
      - type: string
        format: date-time
        examples:
          - '2026-11-24T05:00:00Z'
      - type: 'null'
  appellantId:
    type: string
    minLength: 1
    examples:
      - item-123
  evidence:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - uploadId
        - downloadUrl
      properties:
        uploadId:
          type: string
          minLength: 1
          examples:
            - item-123
        downloadUrl:
          type: string
          format: uri
          examples:
            - https://example.test/resource
  originalDecision:
    type: object
    additionalProperties: false
    required:
      - kind
      - decisionId
      - decidedAt
      - reason
    properties:
      kind:
        type: string
        enum:
          - reportedPost
          - accountModeration
      decisionId:
        type: string
        minLength: 1
        examples:
          - item-123
      decidedAt:
        type: string
        format: date-time
        examples:
          - '2026-11-24T05:00:00Z'
      reason:
        type: string
        minLength: 1
        examples:
          - Lý do đã được kiểm tra.
  reviewHistory:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - decisionId
        - reviewerId
        - reason
        - decidedAt
        - outcome
      properties:
        decisionId:
          type: string
          minLength: 1
          examples:
            - item-123
        reviewerId:
          type: string
          minLength: 1
          examples:
            - item-123
        reason:
          type: string
          minLength: 1
          examples:
            - Lý do đã được kiểm tra.
        decidedAt:
          type: string
          format: date-time
          examples:
            - '2026-11-24T05:00:00Z'
        outcome:
          type: string
          enum:
            - uphold
            - overturn
            - adjust
