type: object
additionalProperties: false
required:
  - token
  - newPassword
properties:
  token:
    type: string
    minLength: 1
    examples:
      - fictional-secret-123
    writeOnly: true
  newPassword:
    type: string
    minLength: 15
    maxLength: 128
    description: 15–128 ký tự Unicode khi nhập. Core chuẩn hóa NFC trước khi băm.
    examples:
      - fictional-secret-123
    writeOnly: true
