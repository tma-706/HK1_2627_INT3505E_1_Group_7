type: object
additionalProperties: false
required:
  - accountId
  - role
  - expiresAt
properties:
  accountId:
    type: string
    minLength: 1
    examples:
      - item-123
  role:
    type: string
    enum:
      - member
      - admin
  expiresAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
