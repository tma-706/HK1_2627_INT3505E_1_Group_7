type: object
description: Chỉ cập nhật các trường được gửi. Trường vắng mặt giữ nguyên giá trị hiện tại.
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    examples:
      - Ví và túi
  status:
    type: string
    enum:
      - active
      - retired
  replacementCategoryId:
    description: Gửi null để bỏ danh mục thay thế đang được thiết lập.
    anyOf:
      - type: string
        minLength: 1
        examples:
          - item-123
      - type: 'null'
minProperties: 1
