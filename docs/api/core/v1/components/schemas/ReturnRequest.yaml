type: object
additionalProperties: false
required:
  - requestId
  - postId
  - interactionId
  - status
  - startedAt
  - confirmationDueAt
  - needsReviewAt
  - counterpartConfirmed
properties:
  requestId:
    type: string
    minLength: 1
    examples:
      - item-123
  postId:
    type: string
    minLength: 1
    examples:
      - item-123
  interactionId:
    type: string
    minLength: 1
    examples:
      - item-123
  status:
    type: string
    enum:
      - pending
      - confirmed
      - cancelled
  startedAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  confirmationDueAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  needsReviewAt:
    type: string
    format: date-time
    examples:
      - '2026-11-24T05:00:00Z'
  counterpartConfirmed:
    type: boolean
