x-ai-mock-environment: &ai-mock-environment
  AI_PROVIDER: ${AI_PROVIDER:-}
  AI_MOCK_REDACT_SCENARIO: ${AI_MOCK_REDACT_SCENARIO:-success}
  AI_MOCK_SEARCH_SCENARIO: ${AI_MOCK_SEARCH_SCENARIO:-success}
  AI_MOCK_DELAY_MS: ${AI_MOCK_DELAY_MS:-1500}

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on:
      core-api:
        condition: service_started
    networks: [edge, application]
  core-api:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      <<: *ai-mock-environment
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_REPLAY_KEY_VERSION: ${SESSION_REPLAY_KEY_VERSION:-}
      SESSION_REPLAY_KEYS: ${SESSION_REPLAY_KEYS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-lost_found}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-lost_found}
    depends_on:
      db:
        condition: service_healthy
    networks: [application, data, identity-egress]
  core-worker:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      <<: *ai-mock-environment
      DATABASE_URL: postgres://${POSTGRES_USER:-lost_found}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-lost_found}
      MATCHING_URL: http://matching:8000
    depends_on:
      db:
        condition: service_healthy
    networks: [application, data]
  matching:
    build:
      context: .
      dockerfile: apps/matching/Dockerfile
    networks: [application]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lost_found}
      POSTGRES_USER: ${POSTGRES_USER:-lost_found}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [data]
volumes:
  postgres_data:
networks:
  edge:
  application:
    internal: true
  data:
    internal: true
  identity-egress:
