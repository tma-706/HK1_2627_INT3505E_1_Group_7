server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/health/ready {
        proxy_pass http://core-api:3000/health/ready;
        proxy_set_header Host $host;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
