server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/health/ready {
        proxy_pass http://core-api:3000/health/ready;
        proxy_set_header Host $host;
    }
    location = /api/auth/sessions {
        access_log off;
        proxy_pass http://core-api:3000/auth/sessions;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/auth/sessions/current/validate {
        access_log off;
        proxy_pass http://core-api:3000/auth/sessions/current/validate;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/auth/sessions/current {
        access_log off;
        proxy_pass http://core-api:3000/auth/sessions/current;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/me/profile {
        access_log off;
        proxy_pass http://core-api:3000/me/profile;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/me/items {
        access_log off;
        error_log /dev/null;
        proxy_pass http://core-api:3000/me/items;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
