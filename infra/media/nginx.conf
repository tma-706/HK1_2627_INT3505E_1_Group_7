server {
    listen 443 ssl;
    ssl_certificate /run/tls/localhost.crt;
    ssl_certificate_key /run/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Presigned read URLs carry credentials in their query strings.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 11m;
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $object_store http://object-store:8333;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    add_header Referrer-Policy no-referrer always;

    location = /campus-private {
        limit_except POST { deny all; }
        proxy_pass $object_store;
    }

    location /campus-private/uploads/ {
        limit_except GET { deny all; }
        proxy_pass $object_store;
    }

    location / {
        return 404;
    }
}
