profiles:
  smoke:
    users: 1
    spawn_rate: 1
    run_seconds: 16
    stop_timeout_seconds: 6
    request_timeout_seconds: 5
    required_requests:
      - /api/auth/sessions
      - /api/auth/sessions [replay]
      - /api/auth/sessions [second-device]
      - /api/auth/sessions/current/validate
      - /api/auth/sessions/current/validate [revoked]
      - /api/auth/sessions/current/validate [other-device]
      - /api/auth/sessions/current
      - /api/auth/sessions/current [replay]
  local-pilot:
    requires_smoke: true
    users: 3
    spawn_rate: 1
    run_seconds: 40
    stop_timeout_seconds: 6
    request_timeout_seconds: 5
    reopens_per_session: [2, 3]
    wait_between_actions_seconds: [2, 4]
    required_requests:
      - /api/auth/sessions
      - /api/auth/sessions/current/validate
      - /api/auth/sessions/current

staging_target:
  source: PR-01 / TBD-02
  active_sessions_at_least: 200
  state: design_pending_pilot_and_environment
