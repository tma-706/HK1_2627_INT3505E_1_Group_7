    details: "Bước 40 VU quanh mục tiêu PR-01 để tìm bậc nhạy với truy vấn danh sách. Khi đủ mẫu, báo bậc cuối đạt và bậc đầu vi phạm theo từng API; chạm trần thì báo mức cao nhất đã đo."
    phases:
      - name: "Tăng bậc 120"
